name: Hurmat Darbar Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - "hurmat-darbar/admin-android/**"
      - "hurmat-darbar/delivery-android/**"
      - ".github/workflows/hurmat-darbar-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - admin-android
          - delivery-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: hurmat-darbar/${{ matrix.app }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hurmat-darbar-${{ matrix.app }}-debug
          path: hurmat-darbar/${{ matrix.app }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
