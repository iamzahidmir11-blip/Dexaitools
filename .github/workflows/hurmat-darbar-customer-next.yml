name: Hurmat Darbar Customer Next.js CI

on:
  push:
    branches: [main]
    paths:
      - "hurmat-darbar/customer-next/**"
      - ".github/workflows/hurmat-darbar-customer-next.yml"
  pull_request:
    paths:
      - "hurmat-darbar/customer-next/**"
      - ".github/workflows/hurmat-darbar-customer-next.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hurmat-darbar/customer-next
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hurmat-darbar/customer-next/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
