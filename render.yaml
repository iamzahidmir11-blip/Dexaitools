services:
  - type: web
    name: zahid-mir-studio-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-product.txt
    startCommand: gunicorn product_api:app
    healthCheckPath: /health
    envVars:
      - key: SITE_ORIGIN
        value: https://iamzahidmir11-blip.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: zahid-mir-studio-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: LEAD_NOTIFY_EMAIL
        value: zahidmirstudio@gmail.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: zahid-mir-studio-db
    plan: free
    databaseName: zahidstudio
    user: zahidstudio
