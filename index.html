<!DOCTYPE html>
<html lang="hi-Latn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf9f5">
<title>Dex AI</title>
<style>
:root{--bg:#faf9f5;--side:#f3f1ea;--card:#fff;--text:#262522;--muted:#77736b;--line:#e4e1d8;--user:#efede6;--accent:#c96442}
*{box-sizing:border-box}html,body{margin:0;height:100%;font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;height:100dvh;overflow:hidden}.side{width:270px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:13px;gap:9px;transition:transform .2s}.brand{display:flex;align-items:center;gap:9px;padding:5px 7px 18px;font:600 23px Georgia,serif}.mark{color:var(--accent)}.icon{border:0;background:transparent;border-radius:9px;padding:8px;display:grid;place-items:center;color:var(--muted)}.icon:hover{background:var(--user);color:var(--text)}.brandrow{display:flex;align-items:center;justify-content:space-between}.new{display:flex;gap:9px;align-items:center;text-align:left;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}.search{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:9px;color:var(--muted)}.search input{width:100%;min-width:0;border:0;outline:0;background:transparent;font-size:14px}.label{padding:12px 10px 4px;color:var(--muted);font-size:12px}.history{flex:1;overflow:auto}.item{display:flex;align-items:center;border-radius:8px}.item:hover{background:var(--user)}.item button:first-child{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:8px 10px;border:0;background:transparent;font-size:13px}.profile{display:flex;align-items:center;gap:9px;padding:9px;border:0;border-radius:10px;text-align:left;background:transparent}.profile:hover{background:var(--user)}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:white}.profilename{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.main{min-width:0;flex:1;display:flex;flex-direction:column}.top{height:54px;flex:none;display:flex;align-items:center;gap:5px;padding:7px 14px}.title{border:0;background:transparent;border-radius:8px;padding:6px 10px;font-weight:550;max-width:55vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sp{flex:1}.stage{flex:1;overflow:auto;display:flex;flex-direction:column}.welcome{margin:auto;padding:24px;text-align:center}.welcome h1{font:400 clamp(30px,5vw,43px)/1.2 Georgia,serif}.welcome p{color:var(--muted);margin:10px 0 0}.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px}.suggestion{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-size:13px;color:var(--muted)}.suggestion:hover{background:var(--user);color:var(--text)}.thread{width:100%;max-width:740px;margin:0 auto;padding:22px 17px;display:flex;flex-direction:column;gap:22px}.thread:empty{display:none}.msg{overflow-wrap:anywhere}.msg.user{align-self:flex-end;max-width:86%;background:var(--user);padding:10px 15px;border-radius:17px}.msg.ai{display:flex;gap:10px;align-items:flex-start}.ai-mark{color:var(--accent);padding-top:2px}.answer{font:17px/1.75 Georgia,serif;min-width:0}.answer pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--side);padding:12px;border-radius:9px;font:13px/1.6 monospace}.actions{display:flex;gap:3px;margin-top:5px}.actions button{font-size:12px;padding:3px 7px;border:0;background:transparent;color:var(--muted)}.dock{width:100%;max-width:780px;margin:0 auto;padding:0 16px calc(10px + env(safe-area-inset-bottom,0px))}.composer{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 13px 9px 16px}.composer:focus-within{border-color:var(--accent)}#input{display:block;width:100%;min-height:52px;max-height:190px;resize:none;border:0;outline:0;background:transparent;padding:3px 0;font-size:15px}#input::placeholder{color:#99958c}.bar{display:flex;align-items:center;gap:5px}.bar select{border:0;background:transparent;color:var(--muted);font-size:13px;padding:6px;max-width:150px}.send{width:34px;height:34px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:white}.send:disabled{opacity:.4}.note{text-align:center;font-size:11px;color:var(--muted);padding-top:7px}.popup{position:fixed;z-index:50;min-width:210px;max-width:290px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 8px 30px #0002}.popup button{display:block;width:100%;text-align:left;padding:9px 10px;border:0;border-radius:8px;background:transparent;font-size:13px}.popup button:hover{background:var(--user)}.modal{position:fixed;inset:0;z-index:60;background:#0006;display:grid;place-items:center;padding:16px}.modal[hidden]{display:none}.card{width:100%;max-width:400px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px}.card h2{font:500 25px Georgia,serif}.card p{color:var(--muted);font-size:13px}.card input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}.primary{padding:11px;border:0;border-radius:9px;background:var(--accent);color:white}.smallrow{text-align:center;font-size:12px;color:var(--muted)}.link{color:var(--accent);text-decoration:underline;border:0;background:transparent}.err{font-size:12px;color:#c0392b}.toast{position:fixed;z-index:70;bottom:85px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:7px 14px;border-radius:99px;font-size:13px}.toast[hidden]{display:none}
@media(max-width:760px){.side{position:fixed;z-index:30;inset:0 auto 0 0;transform:translateX(-105%);box-shadow:10px 0 35px #0001}.side.open{transform:none}.scrim{display:none;position:fixed;inset:0;background:#0005;z-index:25}.scrim.open{display:block}.top{padding:6px 8px}.thread{padding:18px 13px}.welcome{padding:18px}.suggestions{max-width:340px}.dock{padding:0 9px calc(9px + env(safe-area-inset-bottom,0px))}.bar select{max-width:120px}.brand{padding-bottom:8px}}
</style></head>
<body><div class="app" id="app">
<aside class="side" id="side"><div class="brandrow"><div class="brand"><span class="mark">✦</span> Dex AI</div><button class="icon" id="collapse" aria-label="Close sidebar">‹</button></div>
<button class="new" id="new">＋ <span>Nayi chat</span></button><label class="search">⌕ <input id="search" placeholder="Chats search karo"></label><div class="label">Recent chats</div><nav class="history" id="history"></nav><button class="profile" id="profile"><span class="avatar" id="avatar">G</span><span class="profilename" id="profileName">Guest · Login karo</span><span>···</span></button></aside>
<div class="scrim" id="scrim"></div><main class="main"><header class="top"><button class="icon" id="menu" aria-label="Menu">☰</button><button class="title" id="title">Nayi chat⌄</button><span class="sp"></span><button class="icon" id="theme" title="Theme">◐</button><button class="icon" id="options" title="Chat options">···</button></header>
<section class="stage" id="stage"><div class="welcome" id="welcome"><h1><span class="mark">✦</span> Haan bhai, kya help chahiye?</h1><p>Ideas explore karo, coding seekho, ya apna kaam jaldi finish karo.</p><div class="suggestions" id="suggestions"></div></div><div class="thread" id="thread"></div></section>
<footer class="dock"><div class="composer"><textarea id="input" rows="2" placeholder="Dex AI ko message bhejo..." aria-label="Message"></textarea><div class="bar"><button class="icon" id="tools" title="Tools aur model configure karo">＋</button><select id="model" aria-label="Model configure karo" title="Model configure karo"><option value="auto">Auto model</option><option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="cloudflare">Cloudflare</option></select><span class="sp"></span><button class="send" id="send" disabled aria-label="Send">↑</button></div></div><p class="note">Dex AI galti kar sakta hai — zaroori info verify kar lena.</p></footer></main></div>
<div class="modal" id="auth" hidden><form class="card" id="authForm"><h2 id="authTitle">Dex AI mein login karo</h2><p id="authDesc">Chat shuru karne ke liye login ya account banao.</p><input id="name" placeholder="Tumhara naam" autocomplete="name" hidden><input id="email" type="email" placeholder="Email address" autocomplete="email" required><input id="password" type="password" placeholder="Password (8+ characters)" minlength="8" required><button class="primary" id="authSubmit">Login</button><div class="smallrow"><span id="switchLabel">Account nahi hai?</span> <button class="link" id="switch" type="button">Account banao</button></div><div class="err" id="error"></div><button class="link" id="cancelAuth" type="button">Cancel</button></form></div><div class="toast" id="toast" hidden></div>
<script>
(()=>{const API="https://dexaitools.onrender.com";const $=id=>document.getElementById(id);let token=localStorage.getItem("dexai_token")||"",user=null,signup=false,busy=false,controller=null,chosen="auto",active=null;
let chats=[];try{chats=JSON.parse(localStorage.getItem("dexai_chats")||"[]")}catch(e){chats=[]}
const suggestions=["💡 Idea do","📚 Topic simple samjhao","⌘ Code mein help","✦ Plan bana do"];
suggestions.forEach((s,i)=>{let b=document.createElement("button");b.className="suggestion";b.textContent=s;b.onclick=()=>{$("input").value=["Mujhe ek useful idea do.","Koi mushkil topic simple Hinglish mein samjhao.","Mere code mein help karo.","Mere idea ka step-by-step plan banao."][i];fit();$("input").focus()};$("suggestions").append(b)});
function toast(s){$("toast").textContent=s;$("toast").hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").hidden=true,2000)}
function fit(){let t=$("input");t.style.height="auto";t.style.height=Math.min(t.scrollHeight,190)+"px";$("send").disabled=busy||!t.value.trim()}
function persist(){try{localStorage.setItem("dexai_chats",JSON.stringify(chats.slice(-30)))}catch(e){}renderHistory()}
function newChat(){active=null;renderThread();closeSide();$("input").value="";fit();$("input").focus()}
function renderHistory(){let h=$("history");h.innerHTML="";chats.slice().reverse().forEach(c=>{let b=document.createElement("button");b.textContent=c.title;b.style.cssText="display:block;width:100%;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:8px 10px;border:0;background:transparent;border-radius:8px;font-size:13px;cursor:pointer";b.onclick=()=>{active=c;renderThread();closeSide()};h.append(b)})}
function renderThread(){let th=$("thread");th.innerHTML="";let arr=active?.messages||[];$("welcome").hidden=arr.length>0;$("title").textContent=active?.title||"Nayi chat ⌄";arr.forEach(m=>addBubble(m.role,m.content,false));$("stage").scrollTop=$("stage").scrollHeight}
function addBubble(role,text,scroll=true){let row=document.createElement("div");row.className="msg "+(role==="user"?"user":"ai");if(role==="assistant"){let mark=document.createElement("span");mark.className="ai-mark";mark.textContent="✦";row.append(mark)}let body=document.createElement("div");if(role==="assistant")body.className="answer";body.textContent=text;row.append(body);$("thread").append(row);if(scroll)$("stage").scrollTop=$("stage").scrollHeight;return body}
function openAuth(mode=false){signup=mode;$("auth").hidden=false;$("name").hidden=!mode;$("name").required=mode;$("authTitle").textContent=mode?"Free account banao":"Dex AI mein login karo";$("authDesc").textContent=mode?"Apna account banao aur chat shuru karo.":"Chat continue karne ke liye login karo.";$("authSubmit").textContent=mode?"Account banao":"Login";$("switchLabel").textContent=mode?"Pehle se account hai?":"Account nahi hai?";$("switch").textContent=mode?"Login karo":"Account banao";$("error").textContent=""}
function closeAuth(){$("auth").hidden=true}
function updateUser(){let n=token?(user?.display_name||user?.name||user?.email?.split("@")[0]||"Dex AI user"):"Guest · Login karo";$("profileName").textContent=n;$("avatar").textContent=n[0].toUpperCase()}
async function checkUser(){if(!token){updateUser();return}try{let r=await fetch(API+"/api/auth/me",{headers:{Authorization:"Bearer "+token}});let d=await r.json();if(r.ok)user=d.user||null;else{token="";localStorage.removeItem("dexai_token")}}catch(e){}updateUser()}
$("authForm").addEventListener("submit",async e=>{e.preventDefault();$("authSubmit").disabled=true;$("error").textContent="";try{let body=signup?{name:$("name").value.trim(),email:$("email").value.trim(),password:$("password").value}:{email:$("email").value.trim(),password:$("password").value};let r=await fetch(API+(signup?"/api/auth/signup":"/api/auth/login"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.error||"Login nahi ho saka");token=d.token;user=d.user;localStorage.setItem("dexai_token",token);updateUser();closeAuth();toast("Login successful")}catch(err){$("error").textContent=err.message||"Connection issue"}finally{$("authSubmit").disabled=false}});
$("switch").onclick=()=>openAuth(!signup);$("cancelAuth").onclick=closeAuth;$("auth").onclick=e=>{if(e.target===$("auth"))closeAuth()};
$("profile").onclick=()=>{if(!token){openAuth(false);return}if(confirm("Logout karna hai?")){token="";user=null;localStorage.removeItem("dexai_token");updateUser();toast("Logout ho gaya")}};
$("new").onclick=newChat;$("menu").onclick=()=>{if(matchMedia("(max-width:760px)").matches){$("side").classList.add("open");$("scrim").classList.add("open")}else $("app").classList.toggle("closed")};$("collapse").onclick=closeSide;$("scrim").onclick=closeSide;function closeSide(){$("side").classList.remove("open");$("scrim").classList.remove("open")}
$("search").oninput=()=>{let q=$("search").value.toLowerCase();[...$("history").children].forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(q))};
$("model").onchange=()=>{chosen=$("model").value;toast("Model: "+$("model").selectedOptions[0].textContent)};
$("tools").onclick=()=>{let m=prompt("Model configure karo: auto, gemini, openai, cloudflare",chosen);if(m&&["auto","gemini","openai","cloudflare"].includes(m.toLowerCase())){$("model").value=m.toLowerCase();chosen=m.toLowerCase()}else if(m)toast("Option: auto, gemini, openai, cloudflare")};
$("theme").onclick=()=>{document.body.classList.toggle("dark");if(document.body.classList.contains("dark")){document.documentElement.style.setProperty("--bg","#262624");document.documentElement.style.setProperty("--side","#1f1e1d");document.documentElement.style.setProperty("--card","#30302e");document.documentElement.style.setProperty("--text","#f1efe8");document.documentElement.style.setProperty("--muted","#a5a29a");document.documentElement.style.setProperty("--line","#3d3c39");document.documentElement.style.setProperty("--user","#383735")}else location.reload()};
$("options").onclick=()=>{if(active&&confirm("Is chat ko delete karna hai?")){chats=chats.filter(c=>c!==active);active=null;persist();renderThread()}};
$("input").addEventListener("input",fit);$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
$("send").onclick=send;
async function send(){let text=$("input").value.trim();if(!text||busy)return;if(!token){openAuth(false);$("error").textContent="Pehle login karo ya free account banao.";return}if(!active){active={id:Date.now(),title:text.slice(0,36),messages:[]};chats.push(active)}active.messages.push({role:"user",content:text});$("input").value="";fit();renderThread();persist();busy=true;$("send").textContent="…";$("send").disabled=true;let bubble=addBubble("assistant","Soch raha hoon…");
try{let r=await fetch(API+"/api/chat",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({message:text,provider:chosen})});let d=await r.json();if(!r.ok)throw Error(d.error||"AI response nahi aaya");bubble.textContent=d.reply||"Response empty hai.";active.messages.push({role:"assistant",content:bubble.textContent});persist()}
catch(e){bubble.textContent="Error: "+(e.message||"Server connect nahi hua.");}
finally{busy=false;$("send").textContent="↑";fit();renderHistory();$("stage").scrollTop=$("stage").scrollHeight}}
renderHistory();renderThread();checkUser();
})();
</script></body></html>
