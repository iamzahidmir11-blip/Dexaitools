<style>
.dex-chat-section {
  width: 100%;
  min-height: 75vh;
  padding: 45px 18px;
  display: flex;
  justify-content: center;
  align-items: center;
  box-sizing: border-box;
  font-family: inherit;
}
.dex-chat-box {
  width: 100%;
  max-width: 760px;
  min-height: 510px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid rgba(150,130,255,.3);
  border-radius: 24px;
  background: rgba(17,17,30,.96);
  color: #f5f3ff;
  box-shadow: 0 20px 80px rgba(95,65,255,.16);
}
.dex-chat-head {
  padding: 23px;
  border-bottom: 1px solid rgba(255,255,255,.09);
  text-align: center;
}
.dex-chat-head h2 {
  margin: 0 0 8px;
  font-size: 29px;
  background: linear-gradient(90deg,#a78bfa,#60a5fa);
  color: transparent;
  background-clip: text;
}
.dex-chat-head p {
  margin: 0;
  color: #a5a4bd;
  font-size: 14px;
}
.dex-chat-messages {
  padding: 22px;
  flex: 1;
  min-height: 230px;
  max-height: 420px;
  overflow-y: auto;
}
.dex-message {
  max-width: 88%;
  margin: 0 0 16px;
  padding: 13px 16px;
  border-radius: 16px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.6;
  font-size: 14px;
}
.dex-message.bot {
  background: #222137;
  border: 1px solid rgba(255,255,255,.06);
}
.dex-message.user {
  margin-left: auto;
  background: linear-gradient(135deg,#7056e8,#4169e1);
  color: white;
}
.dex-chat-form {
  display: flex;
  gap: 10px;
  padding: 17px;
  border-top: 1px solid rgba(255,255,255,.09);
}
.dex-chat-form input {
  min-width: 0;
  flex: 1;
  padding: 15px;
  color: white;
  background: #202033;
  border: 1px solid #393653;
  border-radius: 13px;
  outline: none;
  font-size: 15px;
}
.dex-chat-form input:focus {
  border-color: #9580ff;
}
.dex-chat-form button {
  padding: 0 21px;
  border: 0;
  border-radius: 13px;
  background: linear-gradient(135deg,#8b5cf6,#4f70ee);
  color: white;
  font-weight: 700;
  cursor: pointer;
}
.dex-chat-form button:disabled {
  opacity: .6;
  cursor: wait;
}
.dex-chat-status {
  min-height: 18px;
  padding: 0 18px 12px;
  color: #aaa7c4;
  font-size: 12px;
}
@media(max-width:600px) {
  .dex-chat-section { padding: 25px 10px; }
  .dex-chat-box { min-height: 480px; border-radius: 18px; }
  .dex-chat-head h2 { font-size: 25px; }
  .dex-chat-form { padding: 12px; }
  .dex-chat-form button { padding: 0 15px; }
}
</style><section class="dex-chat-section" id="dexAIChat">
  <div class="dex-chat-box">
    <div class="dex-chat-head">
      <h2>✦ DexAI</h2>
      <p>Your AI assistant. Ask anything.</p>
    </div><div class="dex-chat-messages" id="dexMessages" aria-live="polite">
  <div class="dex-message bot">Hey! 👋 I'm DexAI. What would you like to explore today?</div>
</div>

<form class="dex-chat-form" id="dexChatForm">
  <input id="dexChatInput" type="text"
    placeholder="Message DexAI..."
    autocomplete="off" required maxlength="4000"
    aria-label="Message DexAI">
  <button id="dexSendButton" type="submit">Send ↗</button>
</form>
<div class="dex-chat-status" id="dexChatStatus" role="status"></div>

  </div>
</section><script>
(() => {
  const form = document.getElementById("dexChatForm");
  const input = document.getElementById("dexChatInput");
  const messages = document.getElementById("dexMessages");
  const button = document.getElementById("dexSendButton");
  const status = document.getElementById("dexChatStatus");

  function addMessage(text, role) {
    const item = document.createElement("div");
    item.className = "dex-message " + role;
    item.textContent = text;
    messages.appendChild(item);
    messages.scrollTop = messages.scrollHeight;
    return item;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const message = input.value.trim();
    if (!message || button.disabled) return;

    addMessage(message, "user");
    input.value = "";
    button.disabled = true;
    status.textContent = "DexAI is thinking...";

    const waiting = addMessage("Thinking...", "bot");

    try {
      const response = await fetch(
        "https://dexaitools.onrender.com/api/chat",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "AI request failed.");
      }

      waiting.textContent = data.reply || "I couldn't generate a reply. Try again.";
      status.textContent = "";
    } catch (error) {
      waiting.textContent =
        "Sorry, DexAI couldn't respond. Please try again in a moment.";
      status.textContent =
        "Connection error. Check the backend and Gemini API configuration.";
      console.error("DexAI chat error:", error);
    } finally {
      button.disabled = false;
      input.focus();
      messages.scrollTop = messages.scrollHeight;
    }
  });
})();
</script>
