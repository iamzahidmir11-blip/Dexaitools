<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Dex AI — Chat</title>
<style>
:root{color-scheme:light;--bg:#fff;--fg:#202123;--muted:#6b6b70;--line:#e5e5e5;--soft:#f7f7f8;--button:#202123}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}
body{display:flex;flex-direction:column;min-height:100dvh}
button,input,textarea{font:inherit}
button{cursor:pointer}
.top{height:58px;flex:0 0 58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);background:#fff}
.brand{font-size:19px;font-weight:700;letter-spacing:-.6px}
.top-actions{display:flex;align-items:center;gap:8px}
.ghost,.login{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--fg);padding:9px 13px;font-size:14px}
.login{background:var(--button);color:#fff;border-color:var(--button)}
main{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:900px;margin:0 auto}
#messages{flex:1;overflow-y:auto;padding:28px 24px 20px;scroll-behavior:smooth}
.welcome{min-height:45vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.welcome h1{font-size:clamp(27px,5vw,34px);line-height:1.2;margin:0 0 12px;font-weight:700;letter-spacing:-1px}
.welcome p{font-size:15px;line-height:1.6;color:var(--muted);margin:0}
.row{display:flex;margin:0 0 22px;gap:12px;align-items:flex-start}
.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#f0f0f0;font-size:12px;font-weight:700}
.row.user{justify-content:flex-end}
.row.user .bubble{background:#f4f4f4;border-radius:18px;padding:12px 16px;max-width:min(78%,650px);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.row.assistant .bubble{min-width:0;flex:1;padding:3px 0 8px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75;font-size:15.5px}
.row.assistant .avatar{background:#202123;color:#fff}
.composer-area{padding:12px 20px max(12px,env(safe-area-inset-bottom));background:linear-gradient(#ffffffef,#fff 22%);width:100%}
.composer{display:flex;align-items:flex-end;gap:10px;width:100%;border:1px solid #d9d9df;border-radius:23px;padding:10px 12px 10px 17px;box-shadow:0 3px 15px #0000000b;background:#fff}
#prompt{display:block;flex:1;min-width:0;resize:none;border:0;outline:0;background:transparent;color:var(--fg);font-size:16px;line-height:1.5;max-height:200px;min-height:30px;padding:5px 0}
#prompt::placeholder{color:#85858b}
#send{width:38px;height:38px;flex:0 0 38px;border:0;border-radius:50%;background:#202123;color:#fff;font-size:23px;display:flex;align-items:center;justify-content:center}
#send:disabled{opacity:.4;cursor:wait}
.hint{text-align:center;color:#8a8a90;font-size:11px;margin-top:9px}
.status{padding:0 20px 8px;text-align:center;color:#b42318;font-size:13px;display:none}
.modal-backdrop{position:fixed;inset:0;z-index:10;background:#0006;display:none;align-items:center;justify-content:center;padding:18px}
.modal-backdrop.open{display:flex}
.modal{width:min(100%,380px);border:1px solid var(--line);border-radius:18px;background:#fff;padding:24px;box-shadow:0 18px 60px #0002}
.modal h2{font-size:23px;margin:0 0 7px}
.modal p{font-size:13px;color:var(--muted);margin:0 0 20px;line-height:1.5}
.field{display:block;width:100%;padding:12px 13px;border:1px solid #d9d9df;border-radius:10px;margin:0 0 10px;outline:none;background:#fff;color:#202123}
.field:focus{border-color:#777}
.submit{width:100%;border:0;border-radius:10px;background:#202123;color:#fff;padding:12px;font-weight:700;margin-top:4px}
.modal-bottom{font-size:13px;text-align:center;margin-top:16px;color:var(--muted)}
.text-button{border:0;background:none;text-decoration:underline;color:#202123;padding:0}
.close{float:right;border:0;background:none;font-size:22px;color:#777;padding:0}
#authError{color:#b42318;font-size:13px;line-height:1.4;margin-top:10px}
@media(max-width:600px){
 .top{height:52px;flex-basis:52px;padding:0 13px}
 .brand{font-size:18px}
 #messages{padding:22px 14px 16px}
 .welcome{min-height:42vh;padding:12px}
 .welcome p{font-size:14px}
 .composer-area{padding:8px 9px max(9px,env(safe-area-inset-bottom))}
 .composer{gap:8px;padding:8px 9px 8px 14px;border-radius:20px}
 #prompt{font-size:16px;min-height:30px}
 .row.user .bubble{max-width:88%}
 .row.assistant .bubble{font-size:15px}
 .hint{font-size:10px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Dex AI</div>
  <div class="top-actions"><button id="newChat" class="ghost" type="button">New chat</button><button id="loginBtn" class="login" type="button">Log in</button></div>
</header>
<main>
  <section id="messages" aria-live="polite">
    <div class="welcome" id="welcome"><h1>What can I help with?</h1><p>Ask a question, explore an idea, or get something done.</p></div>
  </section>
  <div id="status" class="status" role="status"></div>
  <div class="composer-area">
    <form class="composer" id="chatForm">
      <textarea id="prompt" rows="1" maxlength="4000" placeholder="Message Dex AI" aria-label="Message Dex AI"></textarea>
      <button id="send" type="submit" aria-label="Send message">↑</button>
    </form>
    <div class="hint">Dex AI can make mistakes. Check important information.</div>
  </div>
</main>
<div class="modal-backdrop" id="authModal" role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <form class="modal" id="authForm">
    <button type="button" class="close" id="closeModal" aria-label="Close">×</button>
    <h2 id="authTitle">Welcome to Dex AI</h2>
    <p id="authSubtitle">Log in to start chatting.</p>
    <div id="nameWrap" hidden><input class="field" id="authName" autocomplete="name" placeholder="Your name"></div>
    <input class="field" id="authEmail" type="email" autocomplete="email" placeholder="Email address" required>
    <input class="field" id="authPassword" type="password" autocomplete="current-password" placeholder="Password (8+ characters)" minlength="8" required>
    <button class="submit" id="authSubmit" type="submit">Log in</button>
    <div class="modal-bottom"><span id="switchText">New here?</span> <button class="text-button" type="button" id="switchAuth">Create an account</button></div>
    <div id="authError" role="status"></div>
  </form>
</div>
<script>
(() => {
  const API = "https://dexaitools.onrender.com";
  const $ = id => document.getElementById(id);
  const messages = $("messages"), prompt = $("prompt"), send = $("send"), status = $("status");
  let token = localStorage.getItem("dexai_token") || "";
  let user = null, signupMode = false, sending = false;
  const localMessages = [];
  function showStatus(text) { status.textContent = text || ""; status.style.display = text ? "block" : "none"; }
  function scrollBottom() { messages.scrollTop = messages.scrollHeight; }
  function clearWelcome() { const w=$("welcome"); if(w) w.remove(); }
  function addMessage(role, text) {
    clearWelcome();
    const row=document.createElement("div"); row.className="row "+(role==="user"?"user":"assistant");
    if(role!=="user"){const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent="DX";row.appendChild(avatar);}
    const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=text;row.appendChild(bubble);
    messages.appendChild(row);scrollBottom();return bubble;
  }
  function resetChat() {
    messages.innerHTML='<div class="welcome" id="welcome"><h1>What can I help with?</h1><p>Ask a question, explore an idea, or get something done.</p></div>';
    localMessages.length=0;showStatus("");prompt.value="";resizeInput();prompt.focus();
  }
  function resizeInput(){prompt.style.height="auto";prompt.style.height=Math.min(prompt.scrollHeight,200)+"px";}
  function updateAccount(){ $("loginBtn").textContent = token ? (user?.display_name || user?.email?.split("@")[0] || "Account") : "Log in"; }
  async function loadHistory(){
    if(!token)return;
    try{
      const r=await fetch(API+"/api/history",{headers:{Authorization:"Bearer "+token}});
      if(r.status===401){logout(false);return;}
      const data=await r.json();if(!r.ok||!Array.isArray(data.messages))return;
      const history=data.messages.slice(-30);
      if(history.length){
        clearWelcome();
        history.forEach(m=>{const role=m.role==="user"?"user":"assistant";addMessage(role,m.content);localMessages.push({role,content:m.content});});
      }
    }catch(e){/* history is optional; chat can still be used */ }
  }
  async function verifyLogin(){
    if(!token){updateAccount();return;}
    try{const r=await fetch(API+"/api/auth/me",{headers:{Authorization:"Bearer "+token}});const d=await r.json();if(!r.ok){logout(false);return;}user=d.user||null;updateAccount();}
    catch(e){updateAccount();}
  }
  function openAuth(mode=false){
    signupMode=mode;$("authModal").classList.add("open");$("authError").textContent="";
    $("authTitle").textContent=signupMode?"Create your account":"Welcome to Dex AI";
    $("authSubtitle").textContent=signupMode?"Create a free account to start chatting.":"Log in to start chatting.";
    $("nameWrap").hidden=!signupMode;$("authName").required=signupMode;
    $("authPassword").autocomplete=signupMode?"new-password":"current-password";
    $("authSubmit").textContent=signupMode?"Create account":"Log in";
    $("switchText").textContent=signupMode?"Already have an account?":"New here?";
    $("switchAuth").textContent=signupMode?"Log in":"Create an account";
    $("authError").textContent="";setTimeout(()=>$("authEmail").focus(),80);
  }
  function closeAuth(){$("authModal").classList.remove("open");}
  function logout(clear=true){
    token="";user=null;localStorage.removeItem("dexai_token");updateAccount();
    if(clear)resetChat();
  }
  $("loginBtn").addEventListener("click",()=>token?logout():openAuth(false));
  $("newChat").addEventListener("click",resetChat);
  $("closeModal").addEventListener("click",closeAuth);
  $("authModal").addEventListener("click",e=>{if(e.target===$("authModal"))closeAuth();});
  $("switchAuth").addEventListener("click",()=>openAuth(!signupMode));
  $("authForm").addEventListener("submit",async e=>{
    e.preventDefault();$("authSubmit").disabled=true;$("authError").textContent="";
    try{
      const endpoint=signupMode?"/api/auth/signup":"/api/auth/login";
      const body=signupMode?{name:$("authName").value.trim(),email:$("authEmail").value.trim(),password:$("authPassword").value}:{email:$("authEmail").value.trim(),password:$("authPassword").value};
      const r=await fetch(API+endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      const d=await r.json();if(!r.ok)throw new Error(d.error||"Unable to sign in.");
      token=d.token;user=d.user;localStorage.setItem("dexai_token",token);updateAccount();closeAuth();
      if(!localMessages.length){await loadHistory();}
    }catch(err){$("authError").textContent=err.message||"Connection error. Please try again.";}
    finally{$("authSubmit").disabled=false;}
  });
  $("chatForm").addEventListener("submit",async e=>{
    e.preventDefault();const text=prompt.value.trim();if(!text||sending)return;
    if(!token){openAuth(false);$("authError").textContent="Log in or create a free account before chatting.";return;}
    sending=true;send.disabled=true;showStatus("");addMessage("user",text);localMessages.push({role:"user",content:text});prompt.value="";resizeInput();
    const bubble=addMessage("assistant","Thinking…");
    try{
      const r=await fetch(API+"/api/chat",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({message:text,provider:"auto"})});
      const d=await r.json();
      if(!r.ok){throw new Error(d.error||"The message could not be sent.");}
      bubble.textContent=d.reply||"No response was returned.";localMessages.push({role:"assistant",content:bubble.textContent});
    }catch(err){
      bubble.textContent="";bubble.remove();showStatus(err.message||"Could not connect to Dex AI. Please try again.");
      if(err instanceof TypeError)showStatus("Could not connect to the server. Check your internet connection and try again.");
    }finally{sending=false;send.disabled=false;prompt.focus();scrollBottom();}
  });
  prompt.addEventListener("input",resizeInput);
  prompt.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("chatForm").requestSubmit();}});
  verifyLogin().then(()=>{if(token)loadHistory();});
})();
</script>
</body>
</html>
